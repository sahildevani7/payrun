[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payrun"
version = "0.1.0"
description = "A gross-to-net payroll engine with a command-line interface"
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
payrun = "payrun.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
payrun = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:randomly"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/payrun"]
